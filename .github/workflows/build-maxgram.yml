name: Build Maxgram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false

      - name: Prepare CI secrets, keystore and Firebase stub
        run: |
          touch secrets_for_ci.env
          keytool -genkeypair \
            -keystore Your_Key.jks \
            -alias Your_Alias \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass Your_Password -keypass Your_Password \
            -dname "CN=Maxgram CI, OU=Dev, O=Maxgram, L=City, ST=State, C=US"
          if [ ! -f TMessagesProj/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"maxgram-ci","storage_bucket":"maxgram-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef012345","android_client_info":{"package_name":"uz.unnarsx.cherrygram"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForCiBuildOnly0000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef0123456789abcdef01","android_client_info":{"package_name":"uz.unnarsx.cherrygram.beta"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForCiBuildOnly0000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > TMessagesProj/google-services.json
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log

      - name: Show native build errors
        if: failure()
        run: |
          echo "===== CMake errors from gradle.log ====="
          grep -i -B2 -A25 "cmake error" gradle.log || true
          echo "===== .cxx stderr/stdout tails ====="
          find . -path '*/.cxx/*' \( -name '*stderr*' -o -name '*stdout*' \) -print -exec tail -n 50 {} \; || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxgram-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

name: Build Maxgram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: false

      - name: Prepare CI secrets and debug keystore
        run: |
          touch secrets_for_ci.env
          keytool -genkeypair \
            -keystore Your_Key.jks \
            -alias Your_Alias \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass Your_Password -keypass Your_Password \
            -dname "CN=Maxgram CI, OU=Dev, O=Maxgram, L=City, ST=State, C=US"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxgram-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn

name: Fix Gradle wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official Gradle 8.13 wrapper jar
        run: |
          curl --fail --location --output gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.13.0/gradle/wrapper/gradle-wrapper.jar
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          git commit -m "build: restore official Gradle 8.13 wrapper jar" || exit 0
          git push
